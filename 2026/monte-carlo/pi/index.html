<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monte Carlo π</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 32px 16px;
        background: #f5f6f8;
        color: #243245;
        font-family: system-ui, sans-serif;
      }

      main {
        max-width: 620px;
        margin: 0 auto;
        padding: 28px;
        background: white;
        border: 1px solid #dce2e9;
        border-radius: 16px;
      }

      p { margin: 0; line-height: 1.5; }
      canvas { display: block; width: 100%; aspect-ratio: 1; }

      .controls {
        display: flex;
        align-items: center;
        gap: 24px;
        margin-top: 28px;
      }

      .slider { flex: 1; min-width: 0; }
      label { display: flex; justify-content: space-between; gap: 12px; }
      output { font-weight: 650; font-variant-numeric: tabular-nums; }
      input { width: 100%; margin: 12px 0 0; accent-color: #087f8c; }
      .range-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: #596579; }

      button {
        padding: 12px 28px;
        border: 0;
        border-radius: 8px;
        background: #087f8c;
        color: white;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover { background: #066873; }
      :focus-visible { outline: 3px solid #243245; outline-offset: 4px; }

      .result {
        margin-top: 24px;
        padding: 20px;
        border-radius: 10px;
        background: #f0f7f8;
        text-align: center;
      }

      .estimate { font-size: 2rem; font-weight: 650; font-variant-numeric: tabular-nums; }
      .pi-symbol {
        font-family: "Cambria Math", "STIX Two Math", "STIX Math", "Times New Roman", serif;
        font-style: italic;
        font-weight: 400;
      }

      @media (max-width: 420px) {
        body { padding: 16px 10px; }
        main { padding: 18px; }
        .controls { gap: 16px; }
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="plot" role="img" aria-label="A quarter circle of radius 1 inside a square, with x and y coordinates from 0 to 1.">
        A quarter circle of radius 1 inside a unit square.
      </canvas>

      <div class="controls">
        <div class="slider">
          <label for="samples">Samples <output id="sample-count" for="samples">250</output></label>
          <input id="samples" type="range" min="10" max="1000" step="1" value="250">
          <div class="range-labels"><span>10</span><span>1000</span></div>
        </div>
        <button id="go" type="button">Go</button>
      </div>

      <div class="result" role="status" aria-live="polite" aria-atomic="true">
        <p class="estimate" id="estimate"><span class="pi-symbol">π</span> ≈ <span id="estimate-value">—</span></p>
      </div>
    </main>

    <script>
      const canvas = document.getElementById("plot");
      const ctx = canvas.getContext("2d");
      const samples = document.getElementById("samples");
      const sampleCount = document.getElementById("sample-count");
      const estimateValue = document.getElementById("estimate-value");
      let points = [];

      function draw() {
        // Draw in CSS pixels, with a sharper backing image on high-DPI screens.
        const width = canvas.getBoundingClientRect().width;
        const scale = window.devicePixelRatio || 1;
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(width * scale);
        ctx.setTransform(scale, 0, 0, scale, 0, 0);

        const left = 46;
        const top = 22;
        const size = width - left - 24;
        const bottom = top + size;

        ctx.fillStyle = "#eaf5f6";
        ctx.beginPath();
        ctx.moveTo(left, bottom);
        ctx.arc(left, bottom, size, 0, -Math.PI / 2, true);
        ctx.closePath();
        ctx.fill();

        // Grid lines and tick labels use mathematical coordinates: y increases up.
        ctx.font = "12px system-ui, sans-serif";
        for (let i = 0; i <= 4; i++) {
          const value = i / 4;
          const x = left + value * size;
          const y = bottom - value * size;
          ctx.strokeStyle = "#dce5e9";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, top);
          ctx.lineTo(x, bottom);
          ctx.moveTo(left, y);
          ctx.lineTo(left + size, y);
          ctx.stroke();

          ctx.fillStyle = "#596579";
          ctx.textAlign = "center";
          ctx.textBaseline = "top";
          ctx.fillText(String(value), x, bottom + 9);
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";
          ctx.fillText(String(value), left - 9, y);
        }

        ctx.strokeStyle = "#526277";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(left, top, size, size);
        ctx.strokeStyle = "#087f8c";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(left, bottom, size, 0, -Math.PI / 2, true);
        ctx.stroke();

        // Clip point markers to the square, including those near its edges.
        ctx.save();
        ctx.beginPath();
        ctx.rect(left, top, size, size);
        ctx.clip();
        for (const point of points) {
          ctx.fillStyle = point.inside ? "#087f8c" : "#d16b27";
          ctx.beginPath();
          ctx.arc(left + point.x * size, bottom - point.y * size, 2.5, 0, 2 * Math.PI);
          ctx.fill();
        }
        ctx.restore();

        ctx.fillStyle = "#243245";
        ctx.font = "italic 14px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("x", left + size + 16, bottom);
        ctx.fillText("y", left, top - 13);
      }

      samples.addEventListener("input", () => {
        sampleCount.value = samples.value;
      });

      document.getElementById("go").addEventListener("click", () => {
        const total = Number(samples.value);
        let inside = 0;
        points = Array.from({ length: total }, () => {
          const x = Math.random();
          const y = Math.random();
          const inCircle = x * x + y * y <= 1;
          if (inCircle) inside++;
          return { x, y, inside: inCircle };
        });

        const pi = (4 * inside / total).toFixed(4);
        estimateValue.textContent = pi;
        canvas.setAttribute("aria-label", `${total} random points in a unit square: ${inside} inside the quarter circle and ${total - inside} outside. Estimated pi: ${pi}.`);
        draw();
      });

      new ResizeObserver(draw).observe(canvas);
    </script>
  </body>
</html>
